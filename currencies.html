<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FX converters</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; color: #111; font-family: -apple-system, system-ui, sans-serif; }
  #list {
    min-height: 100dvh;
    display: flex; flex-direction: column; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
  }
  a {
    flex: 1 1 0; min-height: 72px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
    border: 2px solid #111; border-radius: 14px;
    color: inherit; text-decoration: none;
  }
  a:active { background: #f2f2f2; }
  .flag { font-size: clamp(32px, 11vw, 52px); line-height: 1; }
  .name { font-size: clamp(20px, 6.5vw, 30px); font-weight: 700; }
  .cur { font-size: clamp(12px, 3.6vw, 16px); color: #777; margin-top: 2px; }
</style>
</head>
<body>
<nav id="list"></nav>
<script>
  // Hardcoded for now: country, flag, currencies (2–5, first one is focused on open)
  const COUNTRIES = [
    { name: 'Georgia', flag: '🇬🇪', cur: ['GEL', 'RSD', 'RUB', 'USD', 'EUR'] },
    { name: 'Serbia',  flag: '🇷🇸', cur: ['RSD', 'GEL', 'RUB', 'EUR'] },
    { name: 'Turkey',  flag: '🇹🇷', cur: ['TRY', 'GEL', 'USD', 'EUR'] },
    { name: 'Russia',  flag: '🇷🇺', cur: ['RUB', 'GEL', 'RSD', 'USD'] },
    { name: 'Belarus', flag: '🇧🇾', cur: ['BYN', 'RSD', 'GEL', 'RUB', 'EUR'] }
  ];

  const list = document.getElementById('list');
  COUNTRIES.forEach(c => {
    const a = document.createElement('a');
    a.href = 'converter.html?c=' + c.cur.join(',');
    a.innerHTML = `<span class="flag">${c.flag}</span>
      <span><div class="name">${c.name}</div><div class="cur">${c.cur.join(' · ')}</div></span>`;
    list.appendChild(a);
  });
</script>
</body>
</html>
